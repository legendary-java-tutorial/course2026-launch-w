services:
  app:
    build: .          # собрать по Dockerfile из этой папки
    image: app:dev    # и назвать образ app:dev
    ports:
      - "127.0.0.1:8080:3000"
    volumes:
      - counter-restore:/data
    secrets:
      - api_token

volumes:
  counter-restore:
    external: true

secrets:
  api_token:
    file: ./api_token.txt
